{% extends "base.html" %}
{% block title %}Print labels · Assetra{% endblock %}
{% block content %}
{% from "_icons.html" import icon %}
<div class="page-head">
  <div>
    <div class="eyebrow">{{ labels|length }} label{{ 's' if labels|length != 1 }}</div>
    <h1>Print asset labels</h1>
  </div>
  <a href="{{ url_for('asset_list') }}" class="btn btn-ghost">Back to assets</a>
</div>

<div class="label-actions" style="margin-bottom:18px;">
  <button class="btn btn-accent" onclick="window.print()">{{ icon('printer', 16) }}Print all</button>
</div>

<div class="label-grid">
  {% for a in labels %}
  <div class="label-card label-card-tape">
    <div class="lc-qr" id="qrbox-{{ a.id }}"></div>
    <div class="lc-tag lc-tag-big">{{ a.asset_tag }}</div>
  </div>
  {% endfor %}
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const labels = {{ labels|tojson }};
  labels.forEach(function (a) {
    new QRCode(document.getElementById("qrbox-" + a.id), {
      text: a.scan_url,
      width: 140,
      height: 140,
      colorDark: "#16233e",
      colorLight: "#ffffff",
    });
  });
</script>
{% endblock %}
